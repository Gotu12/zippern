# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Release packaging (ApkFlinger / splits) needs more than 2g heap on this app.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
# Third-party libs still on support artifacts; migrate dependencies to AndroidX to drop Jetifier.
android.enableJetifier=true

# Still required for this project with AGP 9.1 + org.jetbrains.kotlin.android (removing breaks plugin application).
# Plan: migrate to AGP built-in Kotlin, then remove both lines — https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Quiets repeated "excludeLibraryComponentsFromConstraints" sync hints when useConstraints=true.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Disabled: configuration cache uses an exclusive lock on .gradle/configuration-cache;
# parallel runs (Android Studio sync + CLI, two terminals, IDE + agent) cause "Timeout waiting to lock".
# Re-enable when only one Gradle process touches this project: org.gradle.configuration-cache=true
org.gradle.configuration-cache=false
